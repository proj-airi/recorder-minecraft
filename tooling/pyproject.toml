[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-recorder"
version = "0.1.0"
description = "Provision and export Minecraft server-side gameplay recordings"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mc-recorder = "mc_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
