name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up proto
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: 0.58.2
          auto-install: false
          cache: true

      - name: Install pinned toolchains
        run: proto install --config-mode local

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true

      - name: Check workspace
        run: pixi run --locked check
