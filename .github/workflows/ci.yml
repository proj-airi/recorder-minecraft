name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up proto
        uses: moonrepo/setup-toolchain@v0.6.4
        with:
          proto-version: 0.58.2
          auto-install: false
          cache: true

      - name: Install pinned toolchains
        run: proto install --config-mode local

      - name: Check Go formatting
        run: test -z "$(find cmd internal databases apis/sdk/go -name '*.go' -type f -exec gofmt -l {} +)"

      - name: Check Protobuf formatting
        run: buf format --diff --exit-code

      - name: Lint Protobuf
        run: buf lint

      - name: Check generated SDKs
        run: |
          buf generate
          git diff --exit-code -- apis/sdk/go apis/sdk/jvm

      - name: Test Go
        run: go test ./...

      - name: Lint Go
        run: golangci-lint run ./...

      - name: Build recorder mod
        run: gradle --project-dir mods/recorder-mod build

      - name: Build scene extractor
        run: gradle --project-dir processors/scene-extractor build installDist

      - name: Build renderer mod
        run: gradle --project-dir mods/renderer-mod build
