[build-system]
requires = [ "setuptools>=68" ]
build-backend = "setuptools.build_meta"

[project]
name = "minerec"
version = "0.1.0"
description = "Record and post-process Minecraft gameplay"
requires-python = ">=3.11"
dependencies = [ "sqlalchemy>=2.0,<3" ]

[project.scripts]
minerec = "minerec.cli:main"

[tool.setuptools.packages.find]
where = [ "src" ]
