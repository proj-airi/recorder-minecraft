[build-system]
requires = [ "setuptools>=68" ]
build-backend = "setuptools.build_meta"

[project]
name = "minerec"
version = "0.1.0"
description = "Provision and export Minecraft server-side gameplay recordings"
requires-python = ">=3.11"
dependencies = [
  "pika>=1.3.2",
]

[project.scripts]
minerec = "mc_recorder.cli:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
mc_recorder = [ "dashboard_dist/**" ]
