version = 1

[server]
# Optional artifact display name. When omitted, the machine hostname is used.
# name = "minecraft"
# `recorder-minecraft init` generates this once. Never share it between server instances.
instance_id = "00000000-0000-4000-8000-000000000000"
eula = false

[paths]
artifacts = "artifacts"
runtime = ".recorder/minecraft/runtime"

[mods]
recorder_project = "mods/recorder-mod"
renderer_project = "mods/renderer-mod"

[processors]
scene_extractor_executable = "processors/scene-extractor/build/install/mc-recorder-scene-extractor/bin/mc-recorder-scene-extractor"

[assets]
# Optional 1.21.4+ Minecraft client jar for dashboard item icons, for example the one Fabric Loom
# caches at "~/.gradle/caches/fabric-loom/1.21.8/minecraft-client.jar". Textures are read locally.
# minecraft_client_jar = ""
