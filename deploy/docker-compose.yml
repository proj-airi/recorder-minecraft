services:
  minecraft:
    image: itzg/minecraft-server:2026.7.0-java21
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - '${MC_PORT}:25565'
    environment:
      EULA: '${MC_EULA}'
      TYPE: FABRIC
      VERSION: '${MC_VERSION}'
      FABRIC_LOADER_VERSION: '${MC_FABRIC_LOADER_VERSION}'
      MEMORY: '${MC_MEMORY}'
      SEED: '${MC_SEED}'
      MODE: '${MC_GAME_MODE}'
      DIFFICULTY: '${MC_DIFFICULTY}'
      VIEW_DISTANCE: '${MC_VIEW_DISTANCE}'
      SIMULATION_DISTANCE: '${MC_SIMULATION_DISTANCE}'
      ONLINE_MODE: '${MC_ONLINE_MODE}'
      MAX_PLAYERS: '${MC_MAX_PLAYERS}'
      LEVEL: '${MC_LEVEL_NAME}'
      MOTD: '${MC_MOTD}'
      ENABLE_RCON: 'false'
      PAUSE_WHEN_EMPTY_SECONDS: '-1'
      MODRINTH_PROJECTS: '${MC_MODRINTH_PROJECTS}'
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      SYNC_SKIP_NEWER_IN_DESTINATION: 'false'
    volumes:
      - '${MC_DATA_HOST_DIR}:/data'
      - '${MC_LOCAL_MODS_HOST_DIR}:/mods:ro'
      - '${MC_CONFIG_SOURCE_HOST_DIR}:/config:ro'
      - '${MC_ARTIFACTS_HOST_DIR}:/artifacts'
    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 18
    stop_grace_period: 2m
