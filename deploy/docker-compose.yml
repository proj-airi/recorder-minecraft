services:
  minecraft:
    image: '${MC_SERVER_IMAGE:-itzg/minecraft-server:2026.7.0-java21}'
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - '${MC_PORT}:25565'
    environment:
      EULA: '${MC_EULA}'
      TYPE: FABRIC
      # Runtime pins: keep in sync with deploy/minecraft-server.Dockerfile,
      # mods/recorder-mod/build.gradle.kts, and
      # processors/scene-extractor/gradle.properties. The scene extractor
      # requires the exact loader, Fabric API, and Kotlin versions recorded in
      # each replay; `verifyServerRuntimePins` checks these values.
      VERSION: '1.21.8'
      FABRIC_LOADER_VERSION: '0.19.3'
      MEMORY: '${MC_MEMORY}'
      SEED: '${MC_SEED}'
      MODE: '${MC_GAME_MODE}'
      DIFFICULTY: '${MC_DIFFICULTY}'
      VIEW_DISTANCE: '${MC_VIEW_DISTANCE}'
      SIMULATION_DISTANCE: '${MC_SIMULATION_DISTANCE}'
      ONLINE_MODE: '${MC_ONLINE_MODE}'
      MAX_PLAYERS: '${MC_MAX_PLAYERS}'
      LEVEL: '${MC_LEVEL_NAME}'
      MOTD: '${MC_MOTD}'
      ENABLE_RCON: 'false'
      PAUSE_WHEN_EMPTY_SECONDS: '-1'
      # Every server mod is an immutable Modrinth version ID. Automatic
      # dependency resolution picks the newest compatible release, which can
      # require a newer loader than the pin above.
      MODRINTH_PROJECTS: 'server-replay:TbWIikrT,fabric-api:g58ofrov,fabric-language-kotlin:bdhiINYC'
      MODRINTH_DOWNLOAD_DEPENDENCIES: none
      SYNC_SKIP_NEWER_IN_DESTINATION: 'false'
    volumes:
      - '${MC_DATA_HOST_DIR}:/data'
      - '${MC_LOCAL_MODS_HOST_DIR}:/mods:ro'
      - '${MC_CONFIG_SOURCE_HOST_DIR}:/config:ro'
      - '${MC_ARTIFACTS_HOST_DIR}:/artifacts'
    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 18
    stop_grace_period: 2m
