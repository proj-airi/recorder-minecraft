services:
  minecraft:
    image: itzg/minecraft-server:2026.7.0-java21
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - '${MC_PORT}:25565'
    environment:
      EULA: '${MC_EULA}'
      TYPE: FABRIC
      VERSION: '${MC_VERSION}'
      FABRIC_LOADER_VERSION: '${MC_FABRIC_LOADER_VERSION}'
      MEMORY: '${MC_MEMORY}'
      SEED: '${MC_SEED}'
      MODE: '${MC_GAME_MODE}'
      DIFFICULTY: '${MC_DIFFICULTY}'
      VIEW_DISTANCE: '${MC_VIEW_DISTANCE}'
      SIMULATION_DISTANCE: '${MC_SIMULATION_DISTANCE}'
      ONLINE_MODE: '${MC_ONLINE_MODE}'
      MAX_PLAYERS: '${MC_MAX_PLAYERS}'
      LEVEL: '${MC_LEVEL_NAME}'
      MOTD: '${MC_MOTD}'
      ENABLE_RCON: 'false'
      PAUSE_WHEN_EMPTY_SECONDS: "-1"
      MODRINTH_PROJECTS: '${MC_MODRINTH_PROJECTS}'
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      SYNC_SKIP_NEWER_IN_DESTINATION: 'false'
    volumes:
      - '${MC_DATA_DIR}:/data'
      - '${MC_LOCAL_MODS_DIR}:/mods:ro'
      - '${MC_CONFIG_SOURCE_DIR}:/config:ro'
      - '${MC_CAPTURE_DIR}:/captures'
      - '${MC_REPLAY_DIR}:/replays'
    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 18
    stop_grace_period: 2m

  storage-monitor:
    image: minerec:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/minerec/Dockerfile
    restart: unless-stopped
    init: true
    command: ['python', '-m', 'minerec.processing.capture.storage_monitor']
    environment:
      PYTHONUNBUFFERED: '1'
      MC_RECORDER_CAPTURE_ROOT: /captures
      MC_RECORDER_REPLAY_ROOT: /replays
      MC_RECORDER_QUOTA_BYTES: '${MC_RECORDER_QUOTA_BYTES}'
      MC_RECORDER_WARN_PERCENT: '${MC_RECORDER_WARN_PERCENT}'
      MC_RECORDER_EVICT_OLDEST: '${MC_RECORDER_EVICT_OLDEST}'
      MC_RECORDER_CHECK_INTERVAL: '${MC_RECORDER_CHECK_INTERVAL}'
    volumes:
      - '${MC_CAPTURE_DIR}:/captures'
      - '${MC_REPLAY_DIR}:/replays'

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 18

  dashboard:
    image: minerec:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/minerec/Dockerfile
    restart: unless-stopped
    init: true
    command: ['minerec', '--config', '/recorder.toml', 'dashboard', 'serve']
    environment:
      PYTHONUNBUFFERED: '1'
      MC_RECORDER_DASHBOARD_USERNAME: '${MC_RECORDER_DASHBOARD_USERNAME}'
      MC_RECORDER_DASHBOARD_PASSWORD: '${MC_RECORDER_DASHBOARD_PASSWORD}'
      MC_RECORDER_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      MC_RECORDER_RENDER_TASK_QUEUE: minerec.render.jobs
      MC_RECORDER_DASHBOARD_STATIC_ROOT: /opt/mc-recorder-dashboard
    ports:
      - '${MC_DASHBOARD_PORT}:${MC_DASHBOARD_PORT}'
    volumes:
      - '${MC_CONFIG_FILE}:/recorder.toml:ro'
      - '${MC_CAPTURE_DIR}:/artifacts/captures'
      - '${MC_REPLAY_DIR}:/artifacts/replays'
      - '${MC_EXPORT_DIR}:/artifacts/exports'
      - '${MC_RUNTIME_DIR}:/.mc-recorder'
      - '${MC_DASHBOARD_STATIC_ROOT}:/opt/mc-recorder-dashboard:ro'
    depends_on:
      rabbitmq:
        condition: service_healthy

  render-dispatcher:
    image: minerec:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/minerec/Dockerfile
    restart: unless-stopped
    init: true
    command: ['minerec', '--config', '/recorder.toml', 'render-dispatcher']
    environment:
      PYTHONUNBUFFERED: '1'
      MC_RECORDER_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      MC_RECORDER_RENDER_TASK_QUEUE: minerec.render.jobs
    volumes:
      - '${MC_CONFIG_FILE}:/recorder.toml:ro'
      - '${MC_RUNTIME_DIR}:/.mc-recorder'
    depends_on:
      rabbitmq:
        condition: service_healthy
