services:
  minecraft:
    image: '${MC_IMAGE}'
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - '${MC_PORT}:25565'
    environment:
      EULA: '${MC_EULA}'
      TYPE: FABRIC
      VERSION: '${MC_VERSION}'
      FABRIC_LOADER_VERSION: '${MC_FABRIC_LOADER_VERSION}'
      MEMORY: '${MC_MEMORY}'
      SEED: '${MC_SEED}'
      MODE: '${MC_GAME_MODE}'
      DIFFICULTY: '${MC_DIFFICULTY}'
      VIEW_DISTANCE: '${MC_VIEW_DISTANCE}'
      SIMULATION_DISTANCE: '${MC_SIMULATION_DISTANCE}'
      ONLINE_MODE: '${MC_ONLINE_MODE}'
      MAX_PLAYERS: '${MC_MAX_PLAYERS}'
      LEVEL: '${MC_LEVEL_NAME}'
      MOTD: '${MC_MOTD}'
      ENABLE_RCON: 'false'
      PAUSE_WHEN_EMPTY_SECONDS: '-1'
      MODRINTH_PROJECTS: '${MC_MODRINTH_PROJECTS}'
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      SYNC_SKIP_NEWER_IN_DESTINATION: 'false'
    volumes:
      - '${MC_DATA_DIR}:/data'
      - '${MC_LOCAL_MODS_DIR}:/mods:ro'
      - '${MC_CONFIG_SOURCE_DIR}:/config:ro'
      - '${MC_CAPTURE_DIR}:/captures'
      - '${MC_REPLAY_DIR}:/replays'
      - '${MC_CONTROL_DIR}:/control'
    healthcheck:
      test: ['CMD', 'mc-health']
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 18
    stop_grace_period: 2m

  storage-monitor:
    image: python:3.11.15-alpine3.24
    restart: unless-stopped
    init: true
    command: ['python', '-m', 'mc_recorder.storage_monitor']
    environment:
      PYTHONPATH: /opt/mc-recorder
      PYTHONUNBUFFERED: '1'
      MC_RECORDER_CAPTURE_ROOT: /captures
      MC_RECORDER_REPLAY_ROOT: /replays
      MC_RECORDER_QUOTA_BYTES: '${MC_CAPTURE_QUOTA_BYTES}'
      MC_RECORDER_WARN_PERCENT: '${MC_CAPTURE_WARN_PERCENT}'
      MC_RECORDER_EVICT_OLDEST: '${MC_CAPTURE_EVICT_OLDEST}'
      MC_RECORDER_CHECK_INTERVAL: '${MC_STORAGE_CHECK_INTERVAL}'
    volumes:
      - '${MC_CAPTURE_DIR}:/captures'
      - '${MC_REPLAY_DIR}:/replays'
      - '${MC_TOOLING_SOURCE_DIR}:/opt/mc-recorder:ro'
