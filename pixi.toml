[workspace]
name = "recorder-minecraft"
version = "0.1.0"
description = "Minecraft gameplay recorder development workspace"
authors = [ "Project AIRI" ]
channels = [ "conda-forge" ]
platforms = [
  "linux-64",
  "osx-arm64"
]
requires-pixi = ">=0.73,<1"

[tasks]
setup-toolchains = "proto install --config-mode local"
recorder-minecraft = "go run ./cmd/recorder-minecraft"
build-recorder-minecraft = "mkdir -p .recorder/minecraft/bin && go build -o .recorder/minecraft/bin/recorder-minecraft ./cmd/recorder-minecraft"
test-go = "go test ./..."
lint-go = "golangci-lint run ./..."
go-format = "find cmd internal databases apis/sdk/go -name '*.go' -type f -exec gofmt -w {} +"
go-format-check = "test -z \"$(find cmd internal databases apis/sdk/go -name '*.go' -type f -exec gofmt -l {} +)\""
buf-format = "buf format -w"
buf-format-check = "buf format --diff --exit-code"
buf-lint = "buf lint"
buf-generate = "buf generate"
buf-generate-check = "buf generate && git diff --exit-code -- apis/sdk/go apis/sdk/jvm"
build-recorder-mod = "gradle --project-dir mods/recorder-mod build"
build-scene-extractor-mod = "gradle --project-dir mods/scene-extractor-mod build installDist"
build-renderer-mod = "gradle --project-dir mods/renderer-mod build"
build-recorder-minecraft-image = { cmd = "docker buildx build --platform linux/amd64 -f cmd/recorder-minecraft/Dockerfile . --tag recorder-minecraft:local --load", depends-on = [
  "build-scene-extractor-mod",
] }
build-mods = { depends-on = [
  "build-recorder-mod",
  "build-scene-extractor-mod",
  "build-renderer-mod"
] }
check = { depends-on = [
  "go-format-check",
  "buf-format-check",
  "buf-lint",
  "buf-generate-check",
  "test-go",
  "lint-go",
  "build-mods",
] }
