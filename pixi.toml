[workspace]
name = "mc-play-recorder"
version = "0.1.0"
description = "Minecraft gameplay recorder development workspace"
authors = [ "Project AIRI" ]
channels = [ "conda-forge" ]
platforms = [
  "linux-64",
  "osx-arm64"
]
requires-pixi = ">=0.73,<1"

[dependencies]
python = "3.14.*"
setuptools = ">=68"
ruff = ">=0.15.22,<0.16"
ty = ">=0.0.61,<0.0.62"

[pypi-dependencies]
minerec = { path = "apps/minerec", editable = true }

[tasks]
setup-jvm = "proto install --config-mode local"
test-python = "python -m unittest discover -s apps/minerec/tests -v"
build-recorder-mod = "gradle --project-dir mods/recorder-mod build"
build-scene-extractor-mod = "gradle --project-dir mods/scene-extractor-mod build installDist"
build-renderer-mod = "gradle --project-dir mods/renderer-mod build"
build-minerec-image = { cmd = "docker buildx build --platform linux/amd64 -f apps/minerec/Dockerfile . --tag minerec:local --load", depends-on = [
  "build-scene-extractor-mod",
] }
build-mods = { depends-on = [
  "build-recorder-mod",
  "build-scene-extractor-mod",
  "build-renderer-mod"
] }
check = { depends-on = [
  "test-python",
  "build-mods",
] }
py-check = { depends-on = [
  "py-lint",
  "py-format-check",
  "py-typecheck"
] }
py-format = "ruff format ."
py-format-check = "ruff format --check ."
py-lint = "ruff check ."
py-lint-fix = "ruff check --fix ."
py-typecheck = "ty check --python $CONDA_PREFIX/bin/python"
