components:
  schemas:
    google.protobuf.Any:
      additionalProperties: {}
      properties:
        '@type':
          type: string
      type: object
    google.rpc.Status:
      properties:
        code:
          format: int32
          type: integer
        details:
          items:
            $ref: '#/components/schemas/google.protobuf.Any'
          type: array
        message:
          type: string
      type: object
    recorder_minecraft.api.v1.AlignmentParticipant:
      description: AlignmentParticipant is one Play named in a session alignment header.
      properties:
        connectionId:
          type: string
        endServerTick:
          format: int64
          type: string
        perceptionProvided:
          description: True when the alignment was given the Play's perception.jsonl.
          type: boolean
        playerName:
          type: string
        playerUuid:
          type: string
        startServerTick:
          description: Connection start and end server tick.
          format: int64
          type: string
      type: object
    recorder_minecraft.api.v1.GetReplayResponse:
      properties:
        replay:
          $ref: '#/components/schemas/recorder_minecraft.api.v1.Replay'
      type: object
    recorder_minecraft.api.v1.GetWorldSessionResponse:
      properties:
        worldSession:
          $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSession'
      type: object
    recorder_minecraft.api.v1.ListArtifactsResponse:
      properties:
        serverInstances:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.ServerInstance'
          type: array
      type: object
    recorder_minecraft.api.v1.ListPlayersResponse:
      properties:
        players:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.PlayerSummary'
          type: array
      type: object
    recorder_minecraft.api.v1.ListReplaysResponse:
      properties:
        replays:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.Replay'
          type: array
      type: object
    recorder_minecraft.api.v1.ListServerInstancesResponse:
      properties:
        serverInstances:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.ServerInstanceSummary'
          type: array
      type: object
    recorder_minecraft.api.v1.ListWorldSessionsResponse:
      properties:
        worldSessions:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSession'
          type: array
      type: object
    recorder_minecraft.api.v1.PlayExtension:
      description: PlayExtension describes optional producer-owned data attached to one Play.
      properties:
        assets:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.PlayExtensionAsset'
          type: array
        extensionType:
          type: string
      type: object
    recorder_minecraft.api.v1.PlayExtensionAsset:
      description: |-
        PlayExtensionAsset is one browser-readable extension asset. Role and schema
        are interpreted by the dashboard module for the extension type.
      properties:
        mediaType:
          type: string
        role:
          type: string
        schema:
          type: string
        url:
          type: string
      type: object
    recorder_minecraft.api.v1.Player:
      properties:
        name:
          type: string
        replays:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.Replay'
          type: array
        uuid:
          type: string
      type: object
    recorder_minecraft.api.v1.PlayerSummary:
      properties:
        name:
          type: string
        replayCount:
          format: uint64
          type: string
        serverInstanceId:
          type: string
        serverName:
          type: string
        uuid:
          type: string
      type: object
    recorder_minecraft.api.v1.RefreshCatalogResponse:
      properties:
        refreshedAt:
          format: date-time
          type: string
        replayCount:
          format: uint64
          type: string
        serverInstanceCount:
          format: uint64
          type: string
        worldSessionCount:
          format: uint64
          type: string
      type: object
    recorder_minecraft.api.v1.Replay:
      properties:
        actionsUrl:
          type: string
        captureFailure:
          type: string
        connectionId:
          type: string
        endServerTick:
          format: int64
          type: string
        endedAt:
          format: date-time
          type: string
        eventsUrl:
          type: string
        extensions:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.PlayExtension'
          type: array
        framesIndexUrl:
          description: 'renders/fpv_frames/frames.jsonl: the frame to server tick index of a render.'
          type: string
        perceptionUrl:
          description: |-
            Derived files under the Play directory. Each URL is present only when the
            file exists as a regular file.
          type: string
        playerName:
          type: string
        playerUuid:
          type: string
        replayFormat:
          type: string
        replayUrl:
          type: string
        sceneUrl:
          type: string
        serverInstanceId:
          type: string
        serverName:
          type: string
        sessionId:
          type: string
        startServerTick:
          format: int64
          type: string
        startedAt:
          format: date-time
          type: string
        summary:
          $ref: '#/components/schemas/recorder_minecraft.catalog.v1.PlaySummary'
        terminalReason:
          type: string
        validationError:
          type: string
        video:
          $ref: '#/components/schemas/recorder_minecraft.api.v1.VideoAsset'
        worldSessionId:
          description: |-
            WorldSession.id of the world session that covers this Play, when one is
            readable in the same server instance.
          type: string
        worldSessionLink:
          $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSessionLink'
      type: object
    recorder_minecraft.api.v1.ServerInstance:
      properties:
        instanceId:
          type: string
        name:
          type: string
        players:
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.Player'
          type: array
        worldSessions:
          description: World sessions are listed in full; player and time filters do not apply to them.
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSession'
          type: array
      type: object
    recorder_minecraft.api.v1.ServerInstanceSummary:
      properties:
        instanceId:
          type: string
        name:
          type: string
        playerCount:
          format: uint64
          type: string
        replayCount:
          format: uint64
          type: string
        worldSessionCount:
          format: uint64
          type: string
      type: object
    recorder_minecraft.api.v1.VideoAsset:
      properties:
        frameCount:
          format: uint64
          type: string
        framesPerSecond:
          format: double
          type: number
        height:
          format: int64
          type: integer
        mediaType:
          type: string
        sizeBytes:
          format: uint64
          type: string
        url:
          type: string
        width:
          format: int64
          type: integer
      type: object
    recorder_minecraft.api.v1.WorldSession:
      description: WorldSession is one directory under world/sessions/ of a server instance.
      properties:
        alignments:
          description: JSONL files in alignments/, sorted by name.
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSessionAlignment'
          type: array
        endServerTick:
          description: Absent while recording or after a crash.
          format: int64
          type: string
        endedAt:
          format: date-time
          type: string
        eventsUrl:
          type: string
        id:
          description: Directory name, <started-at>--<session-id>. Unique within a server instance.
          type: string
        knownGaps:
          items:
            type: string
          type: array
        metadataUrl:
          type: string
        plays:
          description: Plays in the same server instance that link to this world session.
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSessionPlay'
          type: array
        serverInstanceId:
          type: string
        serverName:
          type: string
        sessionId:
          type: string
        startServerTick:
          format: int64
          type: string
        startedAt:
          format: date-time
          type: string
        streamFailure:
          description: Set when the world stream stopped early; coverage ends at end_server_tick.
          type: string
        terminalReason:
          type: string
        validationError:
          description: Set when metadata.json is missing, invalid, or describes an open stream.
          type: string
      type: object
    recorder_minecraft.api.v1.WorldSessionAlignment:
      description: WorldSessionAlignment is one session alignment JSONL under alignments/.
      properties:
        divergenceCount:
          format: uint64
          type: string
        eventCount:
          format: uint64
          type: string
        name:
          description: File name without the .jsonl suffix.
          type: string
        participants:
          description: From the header line.
          items:
            $ref: '#/components/schemas/recorder_minecraft.api.v1.AlignmentParticipant'
          type: array
        sizeBytes:
          format: uint64
          type: string
        url:
          type: string
        validationError:
          description: Set when the header line cannot be read or names another session.
          type: string
      type: object
    recorder_minecraft.api.v1.WorldSessionLink:
      default: WORLD_SESSION_LINK_UNSPECIFIED
      description: |-
        WorldSessionLink tells how a Play was joined to its world session.

         - WORLD_SESSION_LINK_CONTAINER_TRUTH: Play metadata names the world session in world_container_truth.
         - WORLD_SESSION_LINK_SESSION_ID: Play metadata has no world_container_truth (the stream was not healthy at
        connection start); the world session has the same session_id.
      enum:
        - WORLD_SESSION_LINK_UNSPECIFIED
        - WORLD_SESSION_LINK_CONTAINER_TRUTH
        - WORLD_SESSION_LINK_SESSION_ID
      type: string
    recorder_minecraft.api.v1.WorldSessionPlay:
      description: WorldSessionPlay identifies one Play linked to a world session.
      properties:
        connectionId:
          type: string
        link:
          $ref: '#/components/schemas/recorder_minecraft.api.v1.WorldSessionLink'
        playerName:
          type: string
        playerUuid:
          type: string
      type: object
    recorder_minecraft.catalog.v1.FinalInventoryItem:
      properties:
        count:
          format: int32
          type: integer
        damage:
          format: int32
          type: integer
        itemId:
          description: Namespaced Minecraft item identifier.
          type: string
        maxDamage:
          format: int32
          type: integer
        slot:
          description: Player inventory slot number.
          format: int32
          type: integer
      type: object
    recorder_minecraft.catalog.v1.PlaySummary:
      description: PlaySummary is a transient read-only projection of completed Play inputs.
      properties:
        durationTicks:
          description: Inclusive Server tick count from the metadata start tick through the end tick.
          format: uint64
          type: string
        finalInventory:
          description: Slot-preserving inventory from the final Player state.
          items:
            $ref: '#/components/schemas/recorder_minecraft.catalog.v1.FinalInventoryItem'
          type: array
        idlePercentage:
          description: Percentage from 0 through 100 of duration ticks without recorded player activity.
          format: double
          type: number
        observedPathDistanceBlocks:
          description: Sum in blocks of three-dimensional displacement between successive same-dimension Player states.
          format: double
          type: number
        playerStateCount:
          description: Number of Player state snapshots used by this summary.
          format: uint64
          type: string
      type: object
info:
  title: recorder-minecraft/catalog/v1/plays.proto
  version: version not set
openapi: 3.0.3
paths:
  /api/v1/artifacts:
    get:
      description: Returns the complete readable server, player, and replay hierarchy after applying optional filters.
      operationId: artifacts_list
      parameters:
        - description: Restrict results to one recorder installation UUID.
          in: query
          name: serverInstanceId
          schema:
            type: string
        - description: Restrict results to one Minecraft player UUID.
          in: query
          name: playerUuid
          schema:
            type: string
        - description: Include replays whose connection started at or after this instant.
          in: query
          name: startedAtOrAfter
          schema:
            format: date-time
            type: string
        - description: Include replays whose connection started before this instant.
          in: query
          name: startedBefore
          schema:
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.ListArtifactsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: List the artifact catalog.
      tags:
        - Artifacts
  /api/v1/catalog:refresh:
    post:
      description: Discards the briefly cached catalog snapshot and walks the artifacts root again. Other reads may serve a snapshot up to a few seconds old.
      operationId: catalog_refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.RefreshCatalogResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: Rescan the artifacts root.
      tags:
        - Artifacts
  /api/v1/players:
    get:
      operationId: players_list
      parameters:
        - description: Restrict results to one recorder installation UUID.
          in: query
          name: serverInstanceId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.ListPlayersResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: List players.
      tags:
        - Artifacts
  /api/v1/replays:
    get:
      operationId: replays_list
      parameters:
        - description: Restrict results to one recorder installation UUID.
          in: query
          name: serverInstanceId
          schema:
            type: string
        - description: Restrict results to one Minecraft player UUID.
          in: query
          name: playerUuid
          schema:
            type: string
        - description: Include replays whose connection started at or after this instant.
          in: query
          name: startedAtOrAfter
          schema:
            format: date-time
            type: string
        - description: Include replays whose connection started before this instant.
          in: query
          name: startedBefore
          schema:
            format: date-time
            type: string
        - description: Calculate a transient summary for each completed Play after applying the filters.
          in: query
          name: includeSummary
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.ListReplaysResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: List replay resources.
      tags:
        - Artifacts
  /api/v1/server-instances:
    get:
      operationId: server_instances_list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.ListServerInstancesResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: List server instances.
      tags:
        - Artifacts
  /api/v1/server-instances/{serverInstanceId}/players/{playerUuid}/replays/{connectionId}:
    get:
      operationId: replays_get
      parameters:
        - description: Recorder installation UUID.
          in: path
          name: serverInstanceId
          required: true
          schema:
            type: string
        - description: Minecraft player UUID.
          in: path
          name: playerUuid
          required: true
          schema:
            type: string
        - description: Replay connection UUID.
          in: path
          name: connectionId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.GetReplayResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: Get one replay resource.
      tags:
        - Artifacts
  /api/v1/server-instances/{serverInstanceId}/world-sessions/{worldSessionId}:
    get:
      operationId: world_sessions_get
      parameters:
        - description: Recorder installation UUID.
          in: path
          name: serverInstanceId
          required: true
          schema:
            type: string
        - description: World session directory name, <started-at>--<session-id>.
          in: path
          name: worldSessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.GetWorldSessionResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: Get one world session.
      tags:
        - Artifacts
  /api/v1/world-sessions:
    get:
      description: Returns the readable world sessions under world/sessions/ of each server instance, with their alignment files and the Plays that link to them.
      operationId: world_sessions_list
      parameters:
        - description: Restrict results to one recorder installation UUID.
          in: query
          name: serverInstanceId
          schema:
            type: string
        - description: Restrict results to one recorder session_id.
          in: query
          name: sessionId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recorder_minecraft.api.v1.ListWorldSessionsResponse'
          description: A successful response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
          description: An unexpected error response.
      summary: List world sessions.
      tags:
        - Artifacts
tags:
  - name: ArtifactCatalogService
