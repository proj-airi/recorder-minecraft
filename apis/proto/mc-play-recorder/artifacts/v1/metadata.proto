syntax = "proto3";

package mc_play_recorder.artifacts.v1;

import "google/protobuf/timestamp.proto";
import "mc-play-recorder/artifacts/v1/actions.proto";
import "mc-play-recorder/artifacts/v1/common.proto";
import "mc-play-recorder/artifacts/v1/events.proto";
import "mc-play-recorder/artifacts/v1/scene.proto";

option go_package = "github.com/proj-airi/mc-play-recorder/apis/sdk/go/mc-play-recorder/artifacts/v1;artifactsv1";
option java_multiple_files = true;
option java_package = "dev.minerec.artifacts.v1";

// Server identifies one durable recorder installation. Its directory may own
// players, worlds, server configuration snapshots, and future server assets.
message Server {
  string name = 1;
  string instance_id = 2;
  repeated Player players = 3;
  repeated ArtifactFile assets = 4;
}

message Player {
  string name = 1;
  string uuid = 2;
  repeated PlayRecording plays = 3;
}

// PlayRecording is the processed product rooted at one connection directory.
message PlayRecording {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  ServerMetadata metadata = 3;
  PlayerActions actions = 4;
  Capture capture = 5;
  SceneStore scene = 6;
  repeated Render renders = 7;
}

// ServerMetadata is serialized as ProtoJSON at metadata.json.
message ServerMetadata {
  uint32 schema_version = 1;
  string layout_version = 2;
  ServerIdentity server = 3;
  string session_id = 4;
  PlayerIdentity player = 5;
  Connection connection = 6;
  string flashback_capture_contract = 7;
  repeated string known_gaps = 8;
  CaptureMetadata capture = 9;
}

message ServerIdentity {
  string name = 1;
  string instance_id = 2;
}

message PlayerIdentity {
  string name = 1;
  string uuid = 2;
}

message Connection {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  int64 start_server_tick = 3;
  google.protobuf.Timestamp ended_at = 4;
  optional int64 end_server_tick = 5;
  optional string terminal_reason = 6;
  optional string capture_failure = 7;
}

message CaptureMetadata {
  string events = 1;
  string replay = 2;
  string replay_format = 3;
}

message Capture {
  ArtifactFile events = 1;
  ArtifactFile replay = 2;
  repeated CaptureEvent event_records = 3;
}

message Render {
  string kind = 1;
  uint32 width = 2;
  uint32 height = 3;
  double frames_per_second = 4;
  repeated RenderFrame frames = 5;
  ArtifactFile manifest = 6;
  ArtifactFile result = 7;
}

message RenderFrame {
  uint64 ordinal = 1;
  int64 server_tick = 2;
  ArtifactFile image = 3;
}
