syntax = "proto3";

package recorder_minecraft.artifacts.v1;

import "recorder-minecraft/artifacts/v1/actions.proto";
import "recorder-minecraft/artifacts/v1/common.proto";

option go_package = "github.com/proj-airi/recorder-minecraft/apis/sdk/go/recorder-minecraft/artifacts/v1;artifactsv1";
option java_multiple_files = true;
option java_package = "dev.recorderminecraft.artifacts.v1";

message CaptureEvent {
  EventIdentity identity = 1;
  oneof record {
    ControlStateEvent control_state = 20;
    PacketArrivalEvent packet_arrival = 21;
    PacketApplyEvent packet_apply = 22;
    PlayerStateEvent player_state = 23;
    ReplayTimelineEvent replay_timeline = 24;
    ClientInformationEvent client_information = 25;
    ContainerViewEvent container_view = 26;
  }
}

message EventIdentity {
  uint32 schema_version = 1;
  string session_id = 2;
  int64 server_tick = 3;
  uint64 sequence = 4;
  uint64 recorded_at_ns = 5;
  int64 recorded_at_unix_ms = 6;
  string player_uuid = 7;
  string player_name = 8;
  int64 entity_id = 9;
  string connection_id = 10;
  int64 connection_start_server_tick = 11;
}

message ControlStateEvent {
  ControlState state = 1;
}

message PacketArrivalEvent {
  uint64 arrival_sequence = 1;
  string tick_phase = 2;
  string network_thread = 3;
  Packet packet = 4;
}

message PacketApplyEvent {
  uint64 apply_sequence = 1;
  string phase = 2;
  string tick_phase = 3;
  string main_thread = 4;
  optional uint64 arrival_sequence = 5;
  optional int64 arrival_server_tick = 6;
  bool arrival_missing = 7;
  Packet packet = 8;
}

message Packet {
  PacketIdentity identity = 1;
  string action_kind = 2;
  optional CameraOrPositionAction camera_or_position = 3;
  optional MovementInput movement_input = 4;
  bool payload_redacted = 5;
  optional string action = 6;
  optional string direction = 7;
  optional string hand = 8;
  optional int32 interaction_sequence = 9;
  optional int32 slot = 10;
  optional int32 container_id = 11;
  optional int32 container_state_id = 12;
  optional int32 slot_number = 13;
  optional int32 button_number = 14;
  optional string click_type = 15;
  optional int32 action_data = 16;
  optional int32 entity_id = 17;
  optional bool secondary_action = 18;
  optional string interaction = 19;
  Vector3 block_position = 20;
  BlockHit block_hit = 21;
  EntityTarget target = 22;
  optional string changed_slots = 23;
  optional string carried_item = 24;
}

message BlockHit {
  Vector3 block_position = 1;
  string direction = 2;
  Vector3 location = 3;
  bool inside = 4;
}

message EntityTarget {
  int32 entity_id = 1;
  string uuid = 2;
  string type_id = 3;
  bool player = 4;
}

message ReplayTimelineEvent {
  string protocol = 1;
}

message PlayerStateEvent {
  string dimension = 1;
  Vector3 position = 2;
  Rotation rotation = 3;
  Vector3 velocity = 4;
  bool alive = 5;
  bool on_ground = 6;
  string pose = 7;
  bool sprinting = 8;
  bool sneaking = 9;
  bool swimming = 10;
  bool fall_flying = 11;
  bool using_item = 12;
  int32 use_item_remaining_ticks = 13;
  string game_mode = 14;
  double health = 15;
  double max_health = 16;
  double absorption = 17;
  int32 armor = 18;
  int32 air = 19;
  int32 max_air = 20;
  int32 food_level = 21;
  double saturation = 22;
  int32 experience_level = 23;
  double experience_progress = 24;
  int32 total_experience = 25;
  uint32 selected_slot = 26;
  Abilities abilities = 27;
  repeated StatusEffect effects = 28;
  repeated Passenger passengers = 29;
  repeated InventorySlot inventory = 30;
  uint64 state_barrier_apply_sequence = 31;
  ReplayCoverage replay_coverage = 32;
  EntityReference vehicle = 33;
}

message Abilities {
  bool invulnerable = 1;
  bool flying = 2;
  bool may_fly = 3;
  bool instant_build = 4;
  bool may_build = 5;
}

message StatusEffect {
  string effect_id = 1;
  int32 amplifier = 2;
  int32 duration_ticks = 3;
  bool ambient = 4;
  bool visible = 5;
  bool show_icon = 6;
}

message Passenger {
  string uuid = 1;
  string type_id = 2;
}

message EntityReference {
  int32 entity_id = 1;
  string uuid = 2;
  string type_id = 3;
}

message InventorySlot {
  int32 slot = 1;
  string item_id = 2;
  int32 count = 3;
  string components_snbt = 4;
  int32 damage = 5;
  int32 max_damage = 6;
  string components_debug = 7;
}

message ReplayCoverage {
  string kind = 1;
  int32 center_chunk_x = 2;
  int32 center_chunk_z = 3;
  int32 view_distance_chunks = 4;
  bool complete = 5;
}

// Client-reported settings that bound what this actor can perceive.
//
// Scope is actor perception and provenance is captured: values are copied from
// the server's view of the client, not inferred. FOV, GUI scale, and window
// aspect are never reported to the server and are therefore absent.
message ClientInformationEvent {
  ClientInformationSource source = 1;
  string language = 2;
  // Client render distance in chunks before the server clamps it to its own limit.
  int32 view_distance = 3;
  string chat_visibility = 4;
  bool chat_colors = 5;
  // Bit mask of visible player model parts.
  int32 model_customisation = 6;
  string main_hand = 7;
  bool text_filtering = 8;
  bool allows_listing = 9;
  string particle_status = 10;
}

enum ClientInformationSource {
  CLIENT_INFORMATION_SOURCE_UNSPECIFIED = 0;
  // Settings the server held for the player when the play capture joined. The
  // configuration-phase packet that carried them precedes the play stream.
  CLIENT_INFORMATION_SOURCE_JOIN_SNAPSHOT = 1;
  // A play-phase settings packet applied on the server main thread.
  CLIENT_INFORMATION_SOURCE_PACKET = 2;
}

// Container contents this actor was actually sent, or a container close.
//
// Scope is actor perception and provenance is captured: clientbound records are
// observed as the server hands packets to the connection. The player's own
// inventory menu (container id 0) is excluded because player_state covers it.
message ContainerViewEvent {
  ContainerViewKind kind = 1;
  ContainerViewOrigin origin = 2;
  int32 container_id = 3;
  // Menu revision from content and slot packets; absent for open, carried, and close.
  optional int32 state_id = 4;
  // Menu registry ID, for example `minecraft:generic_9x3`; empty when the open was not observed.
  string menu_type = 5;
  // Block that backs the menu, when the menu was opened from a container block entity.
  ContainerViewSource source = 6;
  // Number of leading menu slots that belong to the opened container rather than
  // the player's inventory; absent when the open was not observed.
  optional int32 container_slot_count = 7;
  // Menu slot indexes. CONTENTS lists every non-empty slot, so an absent slot is
  // empty. SLOT lists exactly one slot and uses `minecraft:air` with count 0 for
  // an emptied slot.
  repeated InventorySlot slots = 8;
  // Cursor stack for CONTENTS and CARRIED; `minecraft:air` with count 0 when empty.
  InventorySlot carried_item = 9;
}

enum ContainerViewKind {
  CONTAINER_VIEW_KIND_UNSPECIFIED = 0;
  CONTAINER_VIEW_KIND_OPENED = 1;
  CONTAINER_VIEW_KIND_CONTENTS = 2;
  CONTAINER_VIEW_KIND_SLOT = 3;
  CONTAINER_VIEW_KIND_CARRIED = 4;
  CONTAINER_VIEW_KIND_CLOSED = 5;
}

enum ContainerViewOrigin {
  CONTAINER_VIEW_ORIGIN_UNSPECIFIED = 0;
  // A packet the server sent to this client.
  CONTAINER_VIEW_ORIGIN_CLIENTBOUND = 1;
  // A close packet from this client, applied on the server main thread.
  CONTAINER_VIEW_ORIGIN_SERVERBOUND = 2;
}

message ContainerViewSource {
  string dimension = 1;
  // Integer block coordinates. For a double chest this is the first half.
  Vector3 block_pos = 2;
  string block_entity_type = 3;
  // Second half of a double chest.
  Vector3 secondary_block_pos = 4;
}
