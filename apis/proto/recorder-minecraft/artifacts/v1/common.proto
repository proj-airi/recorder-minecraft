syntax = "proto3";

package recorder_minecraft.artifacts.v1;

option go_package = "github.com/proj-airi/recorder-minecraft/apis/sdk/go/recorder-minecraft/artifacts/v1;artifactsv1";
option java_multiple_files = true;
option java_package = "dev.recorderminecraft.artifacts.v1";

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Rotation {
  double yaw = 1;
  double pitch = 2;
  double head_yaw = 3;
}

message TickRange {
  int64 first_tick = 1;
  int64 last_tick = 2;
}

message ArtifactFile {
  // Path is relative to the owning play recording directory.
  string path = 1;
  string sha256 = 2;
  uint64 size_bytes = 3;
  string media_type = 4;
}
